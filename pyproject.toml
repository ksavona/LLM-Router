[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "0.2.0"
description = "Provider-compatible multi-LLM routing gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial License 1.0.0 (commercial license required for commercial use)" }
authors = [
  { name = "LLM Router Maintainers" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent"
]
dependencies = [
  "PyYAML>=6.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.48.0",
  "httpx>=0.27.0"
]

[project.scripts]
llm-router = "llm_router.cli:main"
hermes-smart-router = "hermes_plugin_starter.cli:main"

[project.entry-points."hermes_agent.plugins"]
hermes-smart-router = "hermes_smart_router:register"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
